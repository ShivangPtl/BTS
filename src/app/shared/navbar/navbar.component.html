<header class="topnav">

  <div class="topnav-top">
    <div class="topnav-brand">
      <div class="brand-mark">B</div>
      <div class="brand-copy">
        <strong>BTS Control</strong>
        <span>Redmine cockpit</span>
      </div>
    </div>

    <nav class="topnav-links" aria-label="Dashboard views">
      <button
        *ngFor="let item of navItems"
        [class.active]="selectedView === item.key"
        (click)="select(item.key)"
        type="button">
        {{ item.label }}
      </button>
    </nav>

    <div class="topnav-user">
      <div class="user-avatar">{{ session?.redmineName | slice:0:2 | uppercase }}</div>
      <div class="user-info">
        <span>Logged in</span>
        <strong>{{ session?.redmineName }}</strong>
      </div>
      <div class="role-badge" *ngIf="session?.role !== 'User'">{{ session?.role }}</div>
      <button class="logout-btn" type="button" (click)="logout()">Logout</button>
    </div>
  </div>

  <div class="topnav-filters">
    <!-- Project -->
    <div class="filter-group">
      <span class="filter-label">Project</span>
      <select [(ngModel)]="selectedProjectId" (change)="filterChange.emit()">
        <option value="all">All projects</option>
        <option *ngFor="let project of projects" [value]="project.id">{{ project.name }}</option>
      </select>
    </div>

    <div class="filter-sep"></div>

    <!-- Range picker trigger + dropdown -->
    <div class="range-picker-wrap" (clickOutside)="closepicker()">

      <!-- Trigger button -->
      <button class="range-trigger" type="button" (click)="togglePicker()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M1 7h14" stroke="currentColor" stroke-width="1.5"/>
          <path d="M5 1v4M11 1v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="range-trigger-label">
          <span class="range-preset-tag" *ngIf="activePreset !== 'custom'">{{ activePreset | titlecase }}</span>
          {{ startDate | date:'dd MMM yyyy' }} – {{ endDate | date:'dd MMM yyyy' }}
        </span>
        <svg class="chevron" [class.open]="pickerOpen" width="10" height="10" viewBox="0 0 10 10">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        </svg>
      </button>

      <!-- Dropdown calendar -->
      <div class="range-dropdown" *ngIf="pickerOpen">

        <!-- Preset pills header -->
        <div class="cal-presets">
          <button
            *ngFor="let p of presets"
            class="cal-preset-btn"
            [class.active]="activePreset === p.key"
            type="button"
            (click)="applyPreset(p.key)">
            {{ p.label }}
          </button>
        </div>

        <!-- Two-month calendars -->
        <div class="cal-months">

          <!-- Left month -->
          <div class="cal-month">
            <div class="cal-header">
              <button type="button" class="cal-nav-btn" (click)="shiftMonth(-1)">‹</button>
              <span>{{ leftMonthLabel }}</span>
              <div class="cal-nav-spacer"></div>
            </div>
            <div class="cal-grid">
              <span class="cal-dow" *ngFor="let d of dow">{{ d }}</span>
              <span
                *ngFor="let cell of leftCells"
                class="cal-cell"
                [class.empty]="!cell.date"
                [class.in-range]="cell.date && isInRange(cell.date)"
                [class.range-start]="cell.date && isStart(cell.date)"
                [class.range-end]="cell.date && isEnd(cell.date)"
                [class.today]="cell.date && isToday(cell.date)"
                (click)="cell.date && selectDay(cell.date)">
                {{ cell.label }}
              </span>
            </div>
          </div>

          <div class="cal-month-divider"></div>

          <!-- Right month -->
          <div class="cal-month">
            <div class="cal-header">
              <div class="cal-nav-spacer"></div>
              <span>{{ rightMonthLabel }}</span>
              <button type="button" class="cal-nav-btn" (click)="shiftMonth(1)">›</button>
            </div>
            <div class="cal-grid">
              <span class="cal-dow" *ngFor="let d of dow">{{ d }}</span>
              <span
                *ngFor="let cell of rightCells"
                class="cal-cell"
                [class.empty]="!cell.date"
                [class.in-range]="cell.date && isInRange(cell.date)"
                [class.range-start]="cell.date && isStart(cell.date)"
                [class.range-end]="cell.date && isEnd(cell.date)"
                [class.today]="cell.date && isToday(cell.date)"
                (click)="cell.date && selectDay(cell.date)">
                {{ cell.label }}
              </span>
            </div>
          </div>

        </div>

        <div class="cal-footer">
          <span class="cal-range-text">{{ selectionHint }}</span>
          <button type="button" class="cal-apply" (click)="applyCustomRange()" [disabled]="!pendingStart || !pendingEnd">Apply</button>
        </div>
      </div>
    </div>

    <div class="filter-sep"></div>

    <div class="filter-chip" *ngIf="selectedProjectId !== 'all'">
      <span>{{ activeProjectLabel }}</span>
      <button type="button" (click)="selectedProjectId = 'all'; filterChange.emit()">✕</button>
    </div>

    <div class="filter-spacer"></div>

    <div class="filter-status">
      <span class="status-dot"></span>
      <span>{{ apiStatus }}</span>
    </div>
  </div>

</header>
