<div class="login-page">

  <header class="topbar">
    <div class="logo-area">
      <div class="logo-box">P</div>
      <div>
        <span class="logo-name">prompt</span>
        <span class="logo-tagline">The pursuit of purity</span>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="form-card">

      <div class="brand">
        <div class="brand-icon">B</div>
        <div class="brand-name">BTS Dashboard</div>
        <div class="brand-sub">Track &middot; Manage &middot; Deliver</div>
      </div>

      <div class="form-divider"></div>

      <div class="error-banner" *ngIf="error">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 5v3.5M8 10.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        {{ error }}
      </div>

      <label class="field-label" for="apiKey">Redmine API Key</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10.5 1a4.5 4.5 0 1 1-3.182 7.682L2 14v-2.5H.5V9H3L4.318 7.682A4.5 4.5 0 0 1 10.5 1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <circle cx="10.5" cy="5.5" r="1" fill="currentColor"/>
        </svg>
        <input
          id="apiKey"
          type="password"
          [(ngModel)]="apiKey"
          placeholder="Paste your API key here"
          (keyup.enter)="onSubmit()"
          [disabled]="loading"
          autocomplete="off"
          spellcheck="false">
      </div>
      <p class="field-hint">
        <a href="https://bts.promptdairytech.com/my/account" target="_blank" rel="noopener">
          Find it in Redmine → My account → API access key ↗
        </a>
      </p>

      <button class="signin-btn" (click)="onSubmit()" [disabled]="loading">
        <span *ngIf="!loading">Sign in →</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

    </div>
  </main>

  <footer class="page-footer">
    <span class="footer-copy">
      Promoted by &copy; 2026,
      <a href="https://www.promptequipments.com" target="_blank" rel="noopener">Prompt Equipments Pvt. Ltd.</a>
      or its affiliates. All rights reserved
    </span>
    <nav class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Policy</a>
      <a href="#">Support</a>
    </nav>
  </footer>

</div>
